<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Unfollow Manager for X Pro</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #faf3e6; color: #2b2118; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 60px 20px; text-align: center; }
  .card { background: #fffdf8; border: 1px solid #eee0c8; border-radius: 16px; padding: 36px 28px; box-shadow: 0 10px 30px rgba(120,90,30,.07); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #8a7a63; line-height: 1.8; font-size: 15px; }
  .spin { font-size: 26px; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  a { color: #1d9bf0; font-weight: 700; text-decoration: none; }
</style>
<script src="https://cdn.paddle.com/paddle/paddle.js"></script>
<script>
  function openCheckout() {
    var m = /[?&]_ptxn=([^&]+)/.exec(window.location.search);
    if (m && window.Paddle) {
      Paddle.Checkout.open({ transactionId: decodeURIComponent(m[1]) });
    }
  }
  if (window.Paddle) {
    Paddle.Initialize({
      token: 'live_071fe304a315a76031df6114c2c',
      eventCallback: function (event) {
        if (event && event.name === 'checkout.completed') {
          window.location.href = 'https://license.xiaonezha.shop/claim';
        }
      }
    });
  }
</script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="spin">●</div>
    <h1>正在打开安全结账…</h1>
    <p>Opening secure checkout…<br>付款完成后会自动跳转到领取授权码页面。<br>After payment you will be redirected to claim your license key.</p>
    <p><a href="#" onclick="openCheckout(); return false;" style="font-size:16px">点此打开结账 · Open checkout</a></p>
    <p style="font-size:13.5px">结账窗口没有弹出？请确认浏览器未拦截弹窗，或返回 <a href="https://license.xiaonezha.shop/buy">购买页</a> 重试。</p>
  </div>
</div>
</body>
</html>
